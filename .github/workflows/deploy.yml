name: Deploy Bot and Scraper

on:
  push:
    branches: [ main, feature/kino-hub-setup ]
  workflow_dispatch:

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Bot to Render
        run: |
          curl -X POST ${{ secrets.RENDER_BOT_DEPLOY_HOOK }}

  deploy-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Scraper to Render
        run: |
          curl -X POST ${{ secrets.RENDER_SCRAPER_DEPLOY_HOOK }}
