version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kino-hub-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kino-hub-network
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kino-hub-bot
    command: python -m bot.main
    depends_on:
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    networks:
      - kino-hub-network
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kino-hub-scraper
    command: python -m scraper.main
    depends_on:
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      SCRAPER_PHONE: ${SCRAPER_PHONE}
      CHANNELS_TO_MONITOR: ${CHANNELS_TO_MONITOR}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - kino-hub-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  kino-hub-network:
    driver: bridge
